<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Embedded RSS Feed</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 2rem;
      background-color: #f9f9f9;
      color: #333;
    }
    h1 {
      text-align: center;
      margin-bottom: 2rem;
    }
    .rss-container {
      max-width: 800px;
      margin: 0 auto;
    }
    iframe {
      width: 100%;
      height: 600px;
      border: none;
    }
  </style>
</head>
<body>
  <h1>Harlem Community Outreach Calendar</h1>
  <div class="rss-container">
    <iframe src="https://rss.app/embed/v1/list/qAyJiMAQiDPTWJJJ"></iframe>
  </div>
</body>
</html>
